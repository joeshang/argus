name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm test
        working-directory: argus-chromium-extension
  native:
    runs-on: macos-14
    strategy:
      matrix:
        sanitizer: [none, undefined]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DARGUS_SANITIZER=${{ matrix.sanitizer }}
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure --parallel 2
